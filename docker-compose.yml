# Senarath Bank — Corporate website
# LAB ENVIRONMENT. Joins the shared "senarath-net" network so the
# nginx gateway (defined in the senarath-ebanking repo) can route to it.
#
# Create the shared network ONCE on WEB01 before bringing anything up:
#   docker network create senarath-net
#
services:
  corporate:
    build: .
    image: senarath/corporate:lab
    container_name: senarath-corporate
    restart: unless-stopped
    environment:
      # Public URL of the online banking host (used for "Log in" links)
      ONLINE_BANKING_URL: "https://online.senarathbank.com"
    ports:
      - "8081:80"
    networks:
      senarath-net:
        aliases: [corporate]
    # No host port is published: traffic arrives only via the nginx gateway.
    # To test this container in isolation, uncomment:
    # ports:
    #   - "8081:80"

networks:
  senarath-net:
    external: true
